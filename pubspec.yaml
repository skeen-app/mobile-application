name: skeen
description: "Dermatological triage tool for Peru (offline-first, on-device AI)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Application layer)
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Code generation annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # SVG rendering
  flutter_svg: ^2.2.4

  # Local key-value storage (auth token persistence)
  shared_preferences: ^2.3.2
  camera: ^0.12.0+1

  # HTTP client (Auth and other network services)
  http: ^1.2.2

  # Image picker (camera + gallery)
  image_picker: ^1.1.2

  # Multipart upload helpers
  http_parser: ^4.0.2

  # Geolocation (Patient context: temperature/UV by current location)
  geolocator: ^13.0.2

  # OS-level permissions (camera, gallery, notifications)
  permission_handler: ^11.3.1

  # ── Detection context: AR-AI bridge ─────────────────────────────
  # On-device classification (EfficientNetB0 → 5 lesion classes)
  tflite_flutter: ^0.11.0
  image: ^4.3.0
  # Encrypted local persistence of LesionAnalysis (AES-256)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  # Stable IDs for LesionAnalysis records
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/skeen_v2_quantized.tflite
    - assets/images/
    - assets/images/home/
    - assets/images/nav/
    - assets/images/profile/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
